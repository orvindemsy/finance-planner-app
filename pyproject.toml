[tool.poetry]
# name = "personal-finance-odemsy"
# version = "0.1.0"
description = "personal finance tracker by odemsy"
authors = ["orvindemsy <demsy@gmail.com>"]
readme = "README.md"
package-mode = false # poetry not for package, only for dependency management

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2.3"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
jinja2 = "^3.1.4"
python-multipart = "^0.0.12"
sqlalchemy = "^2.0.35"
alembic = "^1.13.3"
python-dotenv = "^1.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
