{% extends "base.html" %}
{% block title %}Accounts - Budget Tracker{% endblock %}
{% block content %}
<h2>Add Account</h2>
<form class="inline-form" method="post" action="/accounts">
    <label>Name <input type="text" name="name" placeholder="Debit Yucho, Cash, PayPay..." required></label>
    <label>Currency
        <select name="currency" required>
            <option value="JPY">JPY</option>
            <option value="IDR">IDR</option>
        </select>
    </label>
    <button type="submit">Add</button>
</form>

<h2>Accounts</h2>
{% include "_accounts_table.html" %}
{% endblock %}
