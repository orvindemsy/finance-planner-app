<tr id="settings-row-{{ row.category.id }}">
    <td>{{ row.category.name }}</td>
    <td><span class="badge {{ row.category.type.value }}">{{ row.category.type.value }}</span></td>
    <td>
        <form class="inline-form"
              style="margin:0"
              hx-post="/settings/{{ row.category.id }}"
              hx-target="#settings-row-{{ row.category.id }}"
              hx-swap="outerHTML">
            <input type="hidden" name="currency" value="{{ currency }}">
            <input class="budget-amount-input" type="number" step="0.01" min="0"
                   name="planned_amount" value="{{ row.planned }}">
            <button type="submit">Save</button>
        </form>
    </td>
</tr>
