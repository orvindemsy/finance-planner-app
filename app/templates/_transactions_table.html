<div id="transactions-table">
<table>
    <thead>
        <tr><th>Date</th><th>Category</th><th>Amount</th><th>Description</th><th>Source</th></tr>
    </thead>
    <tbody>
    {% for tx in transactions %}
        <tr>
            <td>{{ tx.date }}</td>
            <td>{{ tx.category.name }}</td>
            <td>{{ "%.2f"|format(tx.amount) }}</td>
            <td>{{ tx.description or "" }}</td>
            <td>{{ tx.source or "" }}</td>
        </tr>
    {% else %}
        <tr><td colspan="5">No transactions match these filters.</td></tr>
    {% endfor %}
    </tbody>
</table>
</div>
