{% extends "base.html" %}
{% block title %}Transactions - Budget Tracker{% endblock %}
{% block content %}
<h2>Add Transaction</h2>
<form class="inline-form"
      hx-post="/transactions"
      hx-target="#transactions-table"
      hx-swap="outerHTML"
      hx-on::after-request="this.reset()">
    <label>Date <input type="date" name="date" required></label>
    <label>Category
        <select name="category_id" required>
            {% for c in categories %}
                <option value="{{ c.id }}">{{ c.name }} ({{ c.type.value }})</option>
            {% endfor %}
        </select>
    </label>
    <label>Amount <input type="number" step="0.01" min="0" name="amount" required></label>
    <label>Description <input type="text" name="description"></label>
    <label>Source <input type="text" name="source" placeholder="cash, bank..."></label>
    <button type="submit">Add</button>
</form>

<h2>Filter</h2>
<form class="inline-form"
      hx-get="/transactions"
      hx-target="#transactions-table"
      hx-swap="outerHTML">
    <label>Start <input type="date" name="start" value="{{ filters.start }}"></label>
    <label>End <input type="date" name="end" value="{{ filters.end }}"></label>
    <label>Category
        <select name="category_id">
            <option value="">All</option>
            {% for c in categories %}
                <option value="{{ c.id }}" {% if filters.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Search <input type="text" name="q" value="{{ filters.q }}"></label>
    <button type="submit" class="secondary">Filter</button>
</form>

{% include "_transactions_table.html" %}
{% endblock %}
